services:
  # =============================================================
  # PostgreSQL Database Service
  # =============================================================
  postgres:
    image: postgres:16-alpine
    container_name: revolutic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-12345678}
      POSTGRES_DB: ${DB_NAME:-revolutic-invoice}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-revolutic-invoice}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =============================================================
  # Next.js Application Service
  # =============================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: revolutic-web
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-12345678}
      - DB_NAME=${DB_NAME:-revolutic-invoice}
      - PORT=5000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
