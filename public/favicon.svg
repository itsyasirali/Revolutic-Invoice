<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Base Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Document & 'R' Symbol -->
  <g filter="url(#shadow)">
    <!-- Main Vertical Bar -->
    <rect x="140" y="110" width="64" height="292" rx="16" fill="#ffffff" />
    <!-- Top Arc of R -->
    <path d="M140 110h140c46 0 84 36 84 82s-38 82-84 82H140V110z" fill="#ffffff" />
    <path d="M204 162h76c18 0 32 14 32 30s-14 30-32 30h-76v-60z" fill="url(#bgGrad)" />
    <!-- Leg of R -->
    <path d="M228 260l104 142h-74l-88-120h58z" fill="url(#accentGrad)" />
    <!-- Green Accent Status Badge -->
    <circle cx="390" cy="120" r="32" fill="#10b981" />
    <path d="M378 120l8 8 16-16" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
